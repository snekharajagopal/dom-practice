<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
  </head>
  <body>
    <h1>My Shopping Store</h1>

    <div class="product">
      <h3>Keyboard</h3>
      <p>Price: ₹500</p>
      <button class="addBtn" data-name="Keyboard" data-price="500">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <h3>Mouse</h3>
      <p>Price: ₹300</p>
      <button class="addBtn" data-name="Mouse" data-price="300">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <h3>Headphones</h3>
      <p>Price: ₹800</p>
      <button class="addBtn" data-name="Headphones" data-price="800">
        Add to Cart
      </button>
    </div>

    <h2>Shopping Cart</h2>

    <ul id="cartList"></ul>

    <h3>Total: ₹<span id="total">0</span></h3>
    <script src="q6.js"></script>
  </body>
</html>
